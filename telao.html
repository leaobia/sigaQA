<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGA-QA · Telão</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script src="bugs.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#141a21;color:#f2f4f7;min-height:100vh}
button{font:inherit;cursor:pointer}
.oculto{display:none!important}
.topo{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid #2a323c}
.topo h1{margin:0;font-size:26px}
.topo h1 span{color:#ff5252}
.ensaio{background:#ffd54a;color:#4a3b00;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600}
.btn{border:0;border-radius:12px;padding:14px 26px;font-size:20px;font-weight:700;background:#2d6cdf;color:#fff}
.btn.sec{background:#2a323c;color:#dfe3e8}
.btn.verm{background:#e53935}
.btn:disabled{opacity:.4}
.palco{padding:28px 32px}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:start}
.qr-box{background:#fff;padding:18px;border-radius:18px;display:inline-block}
.codigo{font-size:76px;font-weight:900;letter-spacing:10px;color:#ffd54a;margin:10px 0 0}
.url{font-size:15px;color:#9aa5b1;word-break:break-all;max-width:330px}
.jog-tit{font-size:24px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#2a323c;border-radius:30px;padding:8px 16px;font-size:20px;animation:entra .4s ease}
@keyframes entra{from{transform:scale(.4);opacity:0}}
.controles{display:flex;gap:14px;align-items:center;margin-top:28px;flex-wrap:wrap}
select{font-size:20px;padding:10px;border-radius:10px;background:#2a323c;color:#fff;border:0}
.jogo{display:grid;grid-template-columns:1.4fr 1fr;gap:32px}
.timer{font-size:120px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.timer.alerta{color:#ff5252;animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.55}}
.rank{list-style:none;padding:0;margin:0}
.rank li{display:grid;grid-template-columns:48px 1fr auto auto;gap:14px;align-items:center;background:#1d242d;margin-bottom:8px;border-radius:12px;padding:10px 16px;font-size:24px;transition:all .3s}
.rank li .pos{font-weight:900;color:#9aa5b1}
.rank li:nth-child(1) .pos{color:#ffd54a}
.rank li:nth-child(2) .pos{color:#cfd8dc}
.rank li:nth-child(3) .pos{color:#d7a26a}
.rank li .pts{font-weight:800}
.rank li .bg{color:#9aa5b1;font-size:18px}
.feed{list-style:none;padding:0;margin:0}
.feed li{background:#1d242d;border-left:4px solid #ff5252;margin-bottom:8px;padding:10px 14px;border-radius:8px;font-size:19px;animation:entra .4s ease}
.stat{font-size:20px;color:#9aa5b1;margin:14px 0}
.stat b{color:#fff;font-size:30px}
.podio{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin:30px 0}
.degrau{text-align:center;width:220px}
.degrau .nome{font-size:28px;font-weight:800;margin-bottom:8px}
.degrau .bloco{border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-size:44px;font-weight:900;color:#141a21}
.revela{max-width:1000px;margin:0 auto}
.revela .num{color:#9aa5b1;font-size:20px}
.revela h2{font-size:44px;margin:6px 0 10px}
.revela .onde{font-size:22px;color:#9aa5b1;margin-bottom:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.bx{background:#1d242d;border-radius:14px;padding:16px 20px;font-size:22px;line-height:1.35}
.bx small{display:block;color:#9aa5b1;font-size:15px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.barra{height:22px;background:#2a323c;border-radius:12px;overflow:hidden;margin-top:8px}
.barra div{height:100%;background:#4caf50;transition:width .6s}
.real{display:inline-block;background:#ff5252;color:#fff;font-weight:700;padding:6px 12px;border-radius:8px;font-size:17px;margin-left:10px;vertical-align:middle}
.nav-rev{display:flex;justify-content:space-between;margin-top:26px}
</style>
</head>
<body>
<div class="topo">
  <h1><span>🐞</span> Caça aos Bugs · SIGA-QA</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="ensaio oculto" id="aviso-ensaio">Modo ensaio · só funciona neste computador</span>
    <button class="btn sec" id="bt-nova-sala" style="font-size:15px;padding:8px 14px">Nova sala</button>
  </div>
</div>

<!-- LOBBY -->
<section class="palco" id="v-lobby">
  <div class="lobby">
    <div style="text-align:center">
      <div class="qr-box"><div id="qr"></div></div>
      <div class="codigo" id="codigo"></div>
      <div class="url" id="url"></div>
    </div>
    <div>
      <h2 class="jog-tit">Aponte a câmera para o QR code e entre com seu apelido</h2>
      <div class="stat"><b id="qtd-jog">0</b> pessoas na sala</div>
      <div class="chips" id="chips"></div>
      <div class="controles">
        <label style="font-size:20px">Tempo:</label>
        <select id="sel-duracao"><option value="300">5 min</option><option value="420" selected>7 min</option><option value="600">10 min</option></select>
        <button class="btn" id="bt-comecar">▶ Começar a caça</button>
      </div>
    </div>
  </div>
</section>

<!-- JOGO -->
<section class="palco oculto" id="v-jogo">
  <div class="jogo">
    <div>
      <div class="timer" id="timer">07:00</div>
      <div class="stat">Bugs reportados pela turma: <b id="tot-relatos">0</b> · Bugs escondidos: <b id="tot-bugs"></b></div>
      <h2 class="jog-tit">🏆 Ranking</h2>
      <ol class="rank" id="rank"></ol>
    </div>
    <div>
      <h2 class="jog-tit">📣 Ao vivo</h2>
      <ul class="feed" id="feed"></ul>
      <button class="btn sec" id="bt-encerrar" style="margin-top:20px">Encerrar agora</button>
    </div>
  </div>
</section>

<!-- FIM -->
<section class="palco oculto" id="v-fim">
  <h2 style="text-align:center;font-size:44px;margin:0">🏁 Fim da caça!</h2>
  <div class="podio" id="podio"></div>
  <div style="max-width:800px;margin:0 auto"><ol class="rank" id="rank-final"></ol></div>
  <div style="text-align:center;margin-top:24px"><button class="btn" id="bt-revelar">Revelar os bugs ▶</button></div>
</section>

<!-- REVELAÇÃO -->
<section class="palco oculto" id="v-revela">
  <div class="revela" id="revela"></div>
  <div class="revela nav-rev">
    <button class="btn sec" id="bt-ant">◀ Anterior</button>
    <button class="btn" id="bt-prox">Próximo ▶</button>
  </div>
</section>

<script src="telao.js"></script>
</body>
</html>
